[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Default sync database URL used by Alembic CLI
sqlalchemy.url = postgresql+psycopg2://sentinel:secret@localhost:5432/codesentinel_dev

[post_write_hooks]

[loggers]
keys = root,sentinel,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sentinel]
level = INFO
handlers = console
qualname = app

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
